<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pixel Run</title>
    <script src="bundle.js" defer></script>
  </head>
  <body class="w-full h-screen flex justify-center items-center bg-gray-900">
    <div id="phaser-game" class="relative w-[720px] h-[480px] bg-black">
      <!-- Phaser inyecta su canvas aquí -->

      <!-- HUD o UI dentro del canvas -->
      <div
        id="ui"
        class="absolute top-0 left-0 w-full h-full pointer-events-none"
      >
        <!-- VIDA en la esquina superior derecha -->
        <div
          class="absolute top-2 right-2 bg-black/70 text-white px-3 py-1 rounded text-[1.2rem] font-bold"
        >
          Vida: <span id="vida">100</span>
        </div>
      </div>
    </div>
  </body>
</html>
