<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
<head>
  <meta charset="UTF-8" />
  <title>Pixel Run</title>
</head>
<body>
  <div>
    <h1>Pixel Run</h1>
    <div id="game"></div>
    <div id="score">Score: 0</div>
    <div id="highscore">Highscore: 0</div>
    <button id="start-button">Start Game</button>
    <button id="restart-button" style="display:none;">Restart Game</button>
    <audio id="background-music" src="background-music.mp3" loop></audio>
    <audio id="jump-sound" src="jump-sound.mp3"></audio>
    <audio id="game-over-sound" src="game-over-sound.mp3"></audio>
    <audio id="coin-sound" src="coin-sound.mp3"></audio>
  </div>
  <script src="bundle.js"></script>
</body>
</html>
